services:
  # Local PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: app_db
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"   # remapped from 5433 to avoid clash with clipcraft db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Local Qdrant vector store
  qdrant:
    image: qdrant/qdrant:v1.16.1
    container_name: app_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"   # REST API + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    networks:
      - app_network

  # NestJS Backend (connects to the local Postgres `db` + Qdrant services)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev
    container_name: app_api
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - ./api/.env
    environment:
      # Override host-side URLs so they resolve inside the Docker network
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/app_db?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@db:5432/app_db?schema=public"
      # Used by entrypoint.sh nc wait-for-db loop
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_API_KEY: ""
    ports:
      - "8000:8000"
    # NOTE: dev bind-mount (./api:/app) removed — Colima does not mount
    # "/Volumes/External SSD" (path has a space), so the mount landed empty and
    # broke Prisma. The baked tripper-api image already contains the source.
    networks:
      - app_network
    command: npm run start:dev

  # Angular Frontend with nginx and API proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    depends_on:
      - api
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - app_network

networks:
  app_network:

volumes:
  postgres_data:
  qdrant_data:
